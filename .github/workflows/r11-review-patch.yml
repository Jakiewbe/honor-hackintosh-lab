name: HONOR R1.1 review-only bounds patch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honor-r11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-qualification:
    runs-on: macos-15-intel
    timeout-minutes: 18
    env:
      PINNED_NULLMOTH: 0960b2ef5dbc4a573056d4c8e042a5bd2e15d651
    steps:
      - name: Checkout research-only patch and test harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm x86_64 and select Xcode 16
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || { echo 'BLOCKED: not Intel'; exit 2; }
          version="$(xcodebuild -version)"
          if [[ "$version" != "Xcode 16."* ]]; then
            found=''
            for app in /Applications/Xcode_16*.app; do
              if [[ -d "$app/Contents/Developer" ]]; then
                found="$app/Contents/Developer"
                break
              fi
            done
            [[ -n "$found" ]] || { echo 'BLOCKED: Xcode 16 not installed'; exit 2; }
            echo "DEVELOPER_DIR=$found" >> "$GITHUB_ENV"
          fi

      - name: Fetch and check exact pristine upstream before patching
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r11-logs"
          src="$RUNNER_TEMP/r11-nullmoth"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/nullmoth/nvidia-macos-driver.git
          git -C "$src" fetch --no-tags --depth 1 origin "$PINNED_NULLMOTH"
          git -C "$src" checkout --detach -q FETCH_HEAD
          [[ "$(git -C "$src" rev-parse HEAD)" == "$PINNED_NULLMOTH" ]]
          python3 scripts/verify_pinned_source.py --repo "$src" | tee "$RUNNER_TEMP/r11-logs/original-integrity.json"
          echo 'R11_ORIGINAL_PINNED_TREE_VERIFIED'

      - name: Check and apply review candidate in ephemeral upstream copy
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r11-nullmoth"
          patch="$GITHUB_WORKSPACE/patches/r11_scanout_bounds_and_mmio.patch"
          [[ -f "$patch" ]] || { echo 'BLOCKED: patch missing'; exit 2; }
          git -C "$src" apply --check "$patch"
          git -C "$src" apply "$patch"
          git -C "$src" diff --check
          git -C "$src" diff --name-only | sort > "$RUNNER_TEMP/r11-logs/changed-paths.txt"
          printf '%s\n' "kexts/NMIntelFB/intelfb.cpp" "kexts/NVRM/accel/nvrm-accel.cpp" | sort > "$RUNNER_TEMP/r11-logs/expected-paths.txt"
          diff -u "$RUNNER_TEMP/r11-logs/expected-paths.txt" "$RUNNER_TEMP/r11-logs/changed-paths.txt"
          git -C "$src" apply --reverse --check "$patch"
          git -C "$src" diff --stat | tee "$RUNNER_TEMP/r11-logs/diff-stat.txt"
          echo 'R11_PINNED_PATCH_APPLIED_AND_REVERSIBLE'

      - name: Run offline negative boundary model and source gates
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r11-nullmoth"
          python3 tests/test_r10_bounds_model.py > "$RUNNER_TEMP/r11-logs/bounds-model.txt" 2>&1 || {
            cat "$RUNNER_TEMP/r11-logs/bounds-model.txt"
            exit 2
          }
          cat "$RUNNER_TEMP/r11-logs/bounds-model.txt"
          python3 tests/test_r11_patch_contract.py --source "$src" | tee "$RUNNER_TEMP/r11-logs/post-apply-guards.json"
          echo 'R11_HOST_MODEL_AND_PATCH_INVARIANTS_PASS (not a runtime test)'

      - name: Compile and link patched NMIntelFB on actual macOS SDK
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r11-nullmoth/kexts/NMIntelFB"
          build="$RUNNER_TEMP/r11-built"
          log="$RUNNER_TEMP/r11-logs"
          mkdir -p "$build/NMIntelFB.kext/Contents/MacOS"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          headers="$sdk/System/Library/Frameworks/Kernel.framework/Headers"
          [[ -d "$headers/IOKit" ]] || { echo 'BLOCKED: Kernel.framework headers unavailable'; exit 2; }
          xcodebuild -version | tee "$log/xcode.txt"
          plutil -lint "$src/Info.plist" | tee "$log/plist.txt"
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.5 \
            -fapple-kext -mkernel -nostdinc -I "$headers" -I "$src" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common \
            -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -O2 \
            -c "$src/intelfb.cpp" -o "$build/intelfb.o" > "$log/intelfb-compile.txt" 2>&1 || {
              cat "$log/intelfb-compile.txt"
              echo 'R11_INTELFB_COMPILE_FAILED'
              exit 2
            }
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.5 \
            -fapple-kext -nostdlib -Xlinker -kext \
            -lkmodc++ -lkmod -lcc_kext "$build/intelfb.o" \
            -o "$build/NMIntelFB.kext/Contents/MacOS/NMIntelFB" > "$log/intelfb-link.txt" 2>&1 || {
              cat "$log/intelfb-link.txt"
              echo 'R11_INTELFB_LINK_FAILED'
              exit 2
            }
          file "$build/NMIntelFB.kext/Contents/MacOS/NMIntelFB" | tee "$log/intelfb-file.txt"
          grep -q 'Mach-O 64-bit kext bundle x86_64' "$log/intelfb-file.txt"
          echo 'R11_PATCHED_INTELFB_NATIVE_BUILD_PASS (not installed or loaded)'

      - name: Report missing NVIDIA Darwin build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'NVAccel.cpp patch source invariants passed; actual NVAccel native compilation NOT tested.'
            echo 'NullMoth native accel build requires generated NVIDIA r610 Darwin_x86_64 compile_cmds.sh.'
            echo 'Public NVIDIA 610.57.04 sources do not contain this generated file.'
            echo 'Do not interpret this run as a native NVAccel link, macOS loadability, Metal or RTX2050 functionality result.'
          } | tee "$RUNNER_TEMP/r11-logs/nvaccel-limitations.txt"

      - name: Upload text diagnostics (never kext binaries)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-r11-review-diagnostics
          path: ${{ runner.temp }}/r11-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary and no-deployment disclaimer
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## HONOR R1.1 — review-only safety candidate'
            echo '- Never touches original nullmoth upstream or the HONOR laptop.'
            echo '- Pinned checkout, reversible patch, 13 negative/positive model tests, source invariant checks.'
            echo '- Compiles only patched **NMIntelFB**, NOT native NVAccel.'
            echo '- No signed/uploaded/loaded kext, no EFI/BIOS/disk writes.'
            echo '- VBL timer and lifecycle hazards are still NOT fixed by this candidate.'
          } >> "$GITHUB_STEP_SUMMARY"
