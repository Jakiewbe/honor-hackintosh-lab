name: HONOR GPU safety R5 native object and kext link gate

# Manual only. Complete pinned source, original/candidate object compilation; never install/load/run a driver.
on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Exact Xcode app name (without .app)"
        required: true
        default: Xcode_16.4

permissions:
  contents: read

concurrency:
  group: honor-gpu-safety-r5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-objects:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      WANT_XCODE: ${{ inputs.xcode }}
      NULLMOTH_PIN: ac55984c473e746c2a8ebea7ba0913461aa7c393
      OGKM_PIN: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Intel Xcode and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/gpu-safety-r5-logs"
          mkdir -p "$logs"
          [[ "$(uname -m)" == x86_64 ]] || { echo 'BLOCKED: Intel runner required'; exit 2; }
          [[ "$WANT_XCODE" =~ ^Xcode_16[.0-9]*$ ]] || { echo 'BLOCKED: exact Xcode 16 app name required'; exit 2; }
          dev="/Applications/$WANT_XCODE.app/Contents/Developer"
          [[ -d "$dev" ]] || { echo "BLOCKED: Xcode not installed: $WANT_XCODE"; exit 2; }
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$dev"
          brew install make >/dev/null
          { sw_vers; xcodebuild -version; xcrun clang++ --version; xcrun --show-sdk-version; gmake --version; } > "$logs/toolchain.txt"

      - name: Fetch complete fixed inputs without executing upstream scripts
        shell: bash
        run: |
          set -euo pipefail
          for spec in "nm https://github.com/nullmoth/nvidia-macos-driver.git $NULLMOTH_PIN" \
                      "nv https://github.com/NVIDIA/open-gpu-kernel-modules.git $OGKM_PIN"; do
            set -- $spec
            d="$RUNNER_TEMP/gpu-safety-r5-$1"
            git init -q "$d"
            git -C "$d" remote add origin "$2"
            git -C "$d" fetch --no-tags --depth 1 origin "$3"
            git -C "$d" checkout --detach -q FETCH_HEAD
            [[ "$(git -C "$d" rev-parse HEAD)" == "$3" ]]
          done

      - name: Test audit tools and reproduce fixed-source definition inventory
        shell: bash
        run: |
          set -euo pipefail
          for test in test_index_definitions.py test_native_manifest.py test_text_diagnostics.py test_g1_rm_abi.py test_g1_symbol_identity.py test_g1_special_symbol_sources.py test_g1_special_object_providers.py; do
            python3 -m unittest discover -s tools -p "$test" -v
          done
          python3 tools/index-definitions.py "$RUNNER_TEMP/gpu-safety-r5-nv" \
            research/gpu-safety-r5/rm-gap-symbols.txt \
            --json "$RUNNER_TEMP/gpu-safety-r5-logs/rm-gap-index-full.json" \
            --summary "$RUNNER_TEMP/gpu-safety-r5-logs/rm-gap-index-summary.json"
          cmp research/gpu-safety-r5/rm-gap-index.json "$RUNNER_TEMP/gpu-safety-r5-logs/rm-gap-index-summary.json"
          python3 tools/g1_special_symbol_sources.py --nv "$RUNNER_TEMP/gpu-safety-r5-nv" \
            --nm research/gpu-safety-r5/rm-special-undefined.txt \
            --out "$RUNNER_TEMP/gpu-safety-r5-logs/rm-special-sources-full.json" \
            --summary "$RUNNER_TEMP/gpu-safety-r5-logs/rm-special-sources-summary.json"
          cmp research/gpu-safety-r5/rm-special-sources.json "$RUNNER_TEMP/gpu-safety-r5-logs/rm-special-sources-summary.json"

      - name: Verify complete NullMoth patch series in a disposable copy
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_g1_patch_series.py \
            --nm "$RUNNER_TEMP/gpu-safety-r5-nm" --assets research/gpu-safety-r5 \
            --native-script scripts/gpu-safety-r5/native_compile.py \
            --out "$RUNNER_TEMP/gpu-safety-r5-logs/r28-series"

      - name: Compile original and candidate full translation units (objects only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gpu-safety-r5/native_compile.py \
            --nm "$RUNNER_TEMP/gpu-safety-r5-nm" --nv "$RUNNER_TEMP/gpu-safety-r5-nv" \
            --assets research/gpu-safety-r5 --out "$RUNNER_TEMP/gpu-safety-r5-logs" \
            2>&1 | tee "$RUNNER_TEMP/gpu-safety-r5-logs/probe.txt"

      - name: Test real owner-copy transaction and baseline regression (CPU only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_r28_owner_copy.py \
            --candidate "$RUNNER_TEMP/nullmoth-v2.3.3-gpu-safety-r5-candidate" \
            --patch research/gpu-safety-r5/nullmoth-r28-owner-copy-errors.patch \
            --out "$RUNNER_TEMP/gpu-safety-r5-logs/r28-host" --cxx clang++

      - name: Preserve exact Mach-O names in the current unified import inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/classify-imports.py "$RUNNER_TEMP/gpu-safety-r5-logs/nvrm-unified-undefined.txt" \
            --json "$RUNNER_TEMP/gpu-safety-r5-logs/nvrm-unified-import-identities.json"
          python3 tools/g1_special_object_providers.py \
            --sources research/gpu-safety-r5/rm-special-sources.json \
            --native-report "$RUNNER_TEMP/gpu-safety-r5-logs/native-report.json" \
            --object-root "$RUNNER_TEMP" \
            --out "$RUNNER_TEMP/gpu-safety-r5-logs/special-object-providers"

      - name: Audit probe preprocessor configuration and actual object providers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/g1_probe_inventory.py \
            --nv "$RUNNER_TEMP/gpu-safety-r5-nv" \
            --logs "$RUNNER_TEMP/gpu-safety-r5-logs" \
            --definitions research/gpu-safety-r5/symbol-definitions.json

      - name: Observe selected RM record layouts under actual unified TU flags
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/g1_rm_abi.py \
            --nv "$RUNNER_TEMP/gpu-safety-r5-nv" \
            --candidate "$RUNNER_TEMP/nullmoth-v2.3.3-gpu-safety-r5-candidate" \
            --definitions research/gpu-safety-r5/symbol-definitions.json \
            --logs "$RUNNER_TEMP/gpu-safety-r5-logs" \
            --out "$RUNNER_TEMP/gpu-safety-r5-logs/rm-abi"

      - name: Prepare explicit text publication set
        id: text_publication
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/g1_text_diagnostics.py \
            --source "$RUNNER_TEMP/gpu-safety-r5-logs" \
            --out "$RUNNER_TEMP/gpu-safety-r5-text"

      - name: Upload text diagnostics only
        if: ${{ always() && steps.text_publication.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-gpu-safety-r5-native-${{ inputs.xcode }}
          path: ${{ runner.temp }}/gpu-safety-r5-text/
          if-no-files-found: warn
          retention-days: 14

      - name: Record evidence boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## GPU safety: native objects and candidate links; runtime NO-GO'
            echo '- Source tag ac55984 is not claimed to reproduce the v2.3.3 released driver.'
            echo '- Objects and candidate kext links only; no signing, installation, loading, device access or binary upload.'
            echo '- Kernel/private family ABI, headless memory owner, mapping lifetime and GPU runtime remain BLOCKED.'
          } >> "$GITHUB_STEP_SUMMARY"


