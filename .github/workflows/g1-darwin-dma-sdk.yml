name: HONOR G1 Darwin DMA SDK API compile-only

# Manual only; never link, sign, install or execute a KEXT.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-dma-contract:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Checkout probe source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16.4 and validate Intel runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g1-dma-sdk"
          xcode_dir="$(find /Applications -maxdepth 1 -name 'Xcode_16.4*.app' | sort | head -n 1)"
          [[ -n "$xcode_dir" && "$(uname -m)" == "x86_64" ]] || { echo "BLOCKED_XCODE_16_4_OR_INTEL_MISSING"; exit 2; }
          echo "DEVELOPER_DIR=$xcode_dir/Contents/Developer" >> "$GITHUB_ENV"

      - name: Native kernel API compile and symbol inventory
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/g1-dma-sdk"
          xcodebuild -version > "$out/toolchain.txt"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          khdr="$sdk/System/Library/Frameworks/Kernel.framework/Headers"
          echo "SDK=$sdk" >> "$out/toolchain.txt"
          xcrun --sdk macosx --show-sdk-version >> "$out/toolchain.txt"
          [[ -f "$khdr/IOKit/IODMACommand.h" && -f "$khdr/IOKit/IOMemoryDescriptor.h" ]] || { echo "BLOCKED_KERNEL_HEADERS_MISSING"; exit 2; }
          set +e
          xcrun clang++ -arch x86_64 -fapple-kext -mkernel -nostdinc \
            -I "$khdr" -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common \
            -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -O2 \
            -c scripts/g1/dma_sdk_probe.cpp -o "$out/dma-sdk-probe.o" > "$out/compile.log" 2>&1
          rc=$?
          set -e
          cat "$out/compile.log"
          echo "CLANG_RC=$rc" | tee "$out/result.txt"
          if [[ "$rc" -ne 0 ]]; then
            echo "BLOCKED_DARWIN_DMA_SDK_COMPILE" | tee -a "$out/result.txt"
            exit "$rc"
          fi
          file "$out/dma-sdk-probe.o" | tee -a "$out/result.txt"
          file "$out/dma-sdk-probe.o" | grep -q 'Mach-O 64-bit object x86_64' || { echo "BLOCKED_WRONG_OBJECT"; exit 2; }
          xcrun nm -u "$out/dma-sdk-probe.o" > "$out/undefined-symbols.txt"
          shasum -a 256 scripts/g1/dma_sdk_probe.cpp > "$out/source.sha256"
          shasum -a 256 "$out/dma-sdk-probe.o" > "$out/object.sha256"
          echo "DARWIN_DMA_SDK_NATIVE_OBJECT_PASS_RUNTIME_NO_GO" | tee -a "$out/result.txt"

      - name: Upload text diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honor-g1-darwin-dma-sdk-evidence
          path: |
            ${{ runner.temp }}/g1-dma-sdk/toolchain.txt
            ${{ runner.temp }}/g1-dma-sdk/compile.log
            ${{ runner.temp }}/g1-dma-sdk/result.txt
            ${{ runner.temp }}/g1-dma-sdk/undefined-symbols.txt
            ${{ runner.temp }}/g1-dma-sdk/source.sha256
            ${{ runner.temp }}/g1-dma-sdk/object.sha256
          if-no-files-found: warn
          retention-days: 14
