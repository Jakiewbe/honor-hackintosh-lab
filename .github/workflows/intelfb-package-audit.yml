name: HONOR R0.9 Intel kext package inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honor-r09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-inspection:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      NULLMOTH_COMMIT: 0960b2ef5dbc4a573056d4c8e042a5bd2e15d651
    steps:
      - name: Checkout lab scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16 and verify Intel architecture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || { echo 'BLOCKED: non-Intel runner'; exit 2; }
          current="$(xcodebuild -version)"
          if [[ "$current" != "Xcode 16."* ]]; then
            found=''
            for app in /Applications/Xcode_16*.app; do
              if [[ -d "$app/Contents/Developer" ]]; then
                found="$app/Contents/Developer"
                break
              fi
            done
            [[ -n "$found" ]] || { echo 'BLOCKED: Xcode 16 not installed'; exit 2; }
            echo "DEVELOPER_DIR=$found" >> "$GITHUB_ENV"
          fi

      - name: Get exact verified NullMoth commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r09-logs"
          nm="$RUNNER_TEMP/nullmoth-pinned"
          git init -q "$nm"
          git -C "$nm" remote add origin https://github.com/nullmoth/nvidia-macos-driver.git
          git -C "$nm" fetch --no-tags --depth 1 origin "$NULLMOTH_COMMIT"
          git -C "$nm" checkout --detach -q FETCH_HEAD
          [[ "$(git -C "$nm" rev-parse HEAD)" == "$NULLMOTH_COMMIT" ]]
          python3 scripts/verify_pinned_source.py --repo "$nm" | tee "$RUNNER_TEMP/r09-logs/upstream-integrity.json"
          echo 'R09_UPSTREAM_SOURCE_VERIFIED'

      - name: Compile and link native x86_64 Intel kext executable
        shell: bash
        run: |
          set -euo pipefail
          nm="$RUNNER_TEMP/nullmoth-pinned/kexts/NMIntelFB"
          bundle="$RUNNER_TEMP/R09-NMIntelFB.kext"
          obj="$RUNNER_TEMP/intelfb.o"
          binary="$bundle/Contents/MacOS/NMIntelFB"
          log="$RUNNER_TEMP/r09-logs"
          mkdir -p "$bundle/Contents/MacOS"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          headers="$sdk/System/Library/Frameworks/Kernel.framework/Headers"
          [[ -d "$headers/IOKit" ]] || { echo 'BLOCKED: kernel SDK headers unavailable'; exit 2; }
          {
            xcodebuild -version
            echo "SDK=$sdk"
            echo 'Deployment target: macOS 15.5 (explicit); no 15.0 fallback'
          } > "$log/toolchain.txt"
          cp "$nm/Info.plist" "$bundle/Contents/Info.plist"
          set +e
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.5 \
            -fapple-kext -mkernel -nostdinc -I "$headers" -I "$nm" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common \
            -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -O2 \
            -c "$nm/intelfb.cpp" -o "$obj" > "$log/compile.txt" 2>&1
          compile_rc=$?
          set -e
          cat "$log/compile.txt"
          if [[ "$compile_rc" -ne 0 ]]; then
            echo "R09_COMPILE_FAILED exit=$compile_rc"
            exit "$compile_rc"
          fi
          set +e
          xcrun clang++ -arch x86_64 -mmacosx-version-min=15.5 \
            -fapple-kext -nostdlib -Xlinker -kext \
            -lkmodc++ -lkmod -lcc_kext "$obj" -o "$binary" \
            > "$log/link.txt" 2>&1
          link_rc=$?
          set -e
          cat "$log/link.txt"
          if [[ "$link_rc" -ne 0 ]]; then
            echo "R09_LINK_FAILED exit=$link_rc"
            exit "$link_rc"
          fi
          description="$(file -b "$binary")"
          echo "$description" | tee "$log/binary-kind.txt"
          [[ "$description" == *'Mach-O 64-bit kext bundle x86_64'* ]] || {
            echo 'BLOCKED: unexpected Mach-O file type'
            exit 2
          }
          echo 'R09_NATIVE_KEXT_LINK_PASS (unsigned; uninstalled; not loadable claim)'

      - name: Inspect kext metadata, device table and symbols without loading
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/R09-NMIntelFB.kext"
          binary="$bundle/Contents/MacOS/NMIntelFB"
          src="$RUNNER_TEMP/nullmoth-pinned/kexts/NMIntelFB"
          log="$RUNNER_TEMP/r09-logs"
          plutil -lint "$bundle/Contents/Info.plist" | tee "$log/bundle-plist.txt"
          python3 scripts/validate_intelfb_bundle.py --source "$src" --bundle "$bundle" \
            | tee "$log/bundle-validation.json"
          xcrun otool -hv "$binary" > "$log/macho-header.txt"
          xcrun otool -l "$binary" > "$log/macho-load-commands.txt"
          xcrun nm -u "$binary" > "$log/undefined-imports.txt" || true
          {
            echo 'Linker import symbols can legitimately remain unresolved in an uninstalled kext.'
            echo 'No kernel collection dependency resolution or code-signature verification was performed.'
            echo 'A bundled Info.plist + Mach-O proves static package structure only.'
          } > "$log/limitations.txt"
          echo 'R09_STATIC_KEXT_PACKAGE_PASS (no driver loaded; no physical Intel or NVIDIA GPU tested)'

      - name: Upload text-only diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-r09-static-kext-diagnostics
          path: ${{ runner.temp }}/r09-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Record no-deployment guarantee
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## R0.9 — Intel kext static package validation'
            echo '- Unmodified NullMoth source: pinned to 0960b2ef.'
            echo '- Explicit macOS 15.5 deployment minimum used for compilation and linking.'
            echo '- Real NMIntelFB source compiled and linked into a temporary kext bundle.'
            echo '- This is a **static package-only** validation, not a kext loadability or hardware result.'
            echo '- No driver executable artifacts, code signing, deployment, kext loading, firmware, disk or EFI operations.'
          } >> "$GITHUB_STEP_SUMMARY"
