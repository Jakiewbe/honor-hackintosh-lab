name: HONOR G1 loader export metadata probe

# Read-only: does the shipped kernel collection carry export metadata a loader consumes for the
# IOAcceleratorFamily2 member, and do the 27 local-only names appear in it? No load, no build, no device.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honor-g1-kc-exports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe the family member's export metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sw_vers > out/sw_vers.txt
          kc=/System/Library/KernelCollections/SystemKernelExtensions.kc
          shasum -a 256 "$kc" > out/collection-sha256.txt
          ls -l "$kc" >> out/collection-sha256.txt
          python3 - <<'PY'
          import json, pathlib
          names = []
          for path in pathlib.Path('research/stock-v243-audit-20261021').rglob('local-only-binding.json'):
              data = json.loads(path.read_text())
              for row in data.get('rows', []):
                  symbol = row.get('symbol')
                  if symbol and symbol not in names:
                      names.append(symbol)
          pathlib.Path('out/requested-names.json').write_text(json.dumps(sorted(names), indent=1))
          print('requested names:', len(names))
          PY
          # Positive control: build a tiny dylib in this run, so it certainly carries an export trie.
          # The parser must find the export and must not find a name that cannot exist.
          printf 'int g1_export_probe(void) { return 7; }\n' > out/probe.c
          xcrun clang -dynamiclib -o out/libprobe.dylib out/probe.c
          python3 tools/g1_kc_exports.py out/libprobe.dylib libprobe --plain \
            --require _g1_export_probe \
            --controls _g1_definitely_absent_symbol \
            > out/dylib-export-control.json 2> out/dylib-export-control.err || true
          cat out/dylib-export-control.err || true
          python3 tools/g1_kc_exports.py "$kc" com.apple.iokit.IOAcceleratorFamily2 \
            --names out/requested-names.json \
            --controls __ZTV14IOAccelSurface \
            > out/export-probe.json 2> out/export-probe.err || true
          cat out/export-probe.err || true
          head -c 2500 out/export-probe.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-kc-export-probe
          path: out/
          if-no-files-found: error
          retention-days: 14
