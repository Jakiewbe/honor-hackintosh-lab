name: HONOR G1 retired incomplete RM probe (refuses execution)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse incomplete probe; use existing official full build if required
        run: python3 tools/g1_full_rm_probe.py --out "$RUNNER_TEMP/retired-rm"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: g1-retired-rm-text
          path: ${{ runner.temp }}/retired-rm/report.json
          if-no-files-found: error
