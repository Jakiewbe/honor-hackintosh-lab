name: HONOR G1 native gate (B1 rebuild candidate + validator compile)

# Manual only. Builds OGKM 610.57.04 RM/KMS objects for Darwin with an INFERRED configuration (from static analysis
# of the NullMoth v1.15.0 release) and compares them with the released NVRM. Output is a "rebuild candidate" report,
# never a released or loadable driver. No signing, install, load, or binary upload; text logs only.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode 16 to use: newest | all | exact app name such as Xcode_16.4"
        required: true
        default: newest
      extra_cflags:
        description: "Inferred extra macros/flags (EXTRA_CFLAGS) for OGKM objects"
        required: true
        default: "-DNV_UNIX -DNV_LINUX"
      drop_flags:
        description: "Space-separated exact flags removed from every compiler call (empty = none); only after a logged failure"
        required: false
        default: ""
      run_rebuild:
        description: "Run the B1 rebuild candidate job"
        type: boolean
        default: true
      run_b2_probe:
        description: "Optional B2 NVRM/pinned patch diagnostic ONLY; expected BLOCKED (WP1 unknown), never load"
        type: boolean
        default: false
      run_b4_probe:
        description: "Optional B4 patched NVRM.cpp native compile/link (requires B1 and B2; never load)"
        type: boolean
        default: false
      run_b5_probe:
        description: "B5 experimental PCI BAR rollback compile/link (requires B4; no GPU loading)"
        type: boolean
        default: false
      run_b6_probe:
        description: "B6 experimental BAR stop ownership compile/link (requires B4+B5; no GPU loading)"
        type: boolean
        default: false
      run_b7_probe:
        description: "B7 staged RM event-lock preflight compile/link (requires B4+B5+B6; no load)"
        type: boolean
        default: false
      run_b8_probe:
        description: "B8 RM-global stop-admission native compile/link (requires B7; never load)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: honor-g1-native-${{ github.ref }}
  cancel-in-progress: false

env:
  NULLMOTH_COMMIT: cd8e2bb04da48d2fa70cf1895879608f3588dbfb
  NVIDIA_COMMIT: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
  RELEASE_URL: https://github.com/nullmoth/nvidia-macos-driver/releases/download/v1.15.0/nullmoth-nvidia-1.15.0.tar.gz
  RELEASE_SHA256: 6101cf8c37e4a500059ea8ce4d9f131ea107e35ccbeafcbb124d78a97e37e3ec
  NVRM_MEMBER: pkgroot/Library/Extensions/NVRM.kext/Contents/MacOS/NVRM
  NVRM_SHA256: e15a281a0795955711dd89d77f0267365af68483834401a832a91c54898646ff

jobs:
  xcode-inventory:
    runs-on: macos-15-intel
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANT: ${{ inputs.xcode }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]] || { echo 'BLOCKED: not an Intel macOS runner'; exit 2; }
          ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -vi beta | xargs -n1 basename | sed 's/\.app$//' > apps.txt || true
          cat apps.txt
          [[ -s apps.txt ]] || { echo 'BLOCKED: no Xcode 16 installed'; exit 2; }
          matrix="$(WANT="$WANT" python3 - <<'PY'
          import json, os, re
          apps = [a.strip() for a in open("apps.txt") if a.strip()]
          key = lambda a: [int(x) for x in re.findall(r"\d+", a)]
          apps.sort(key=key)
          want = os.environ["WANT"]
          sel = apps if want == "all" else [apps[-1]] if want == "newest" else [a for a in apps if a == want]
          if not sel:
              raise SystemExit(f"BLOCKED: {want} not installed; available {apps}")
          print(json.dumps({"xcode": sel}))
          PY
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected: $matrix"

  b1-rebuild-candidate:
    if: ${{ inputs.run_rebuild }}
    needs: xcode-inventory
    runs-on: macos-15-intel
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.xcode-inventory.outputs.matrix) }}
    env:
      EXTRA: ${{ inputs.extra_cflags }}
      G1_DROP_FLAGS: ${{ inputs.drop_flags }}
    steps:
      - name: Checkout lab scripts only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          dev="/Applications/${{ matrix.xcode }}.app/Contents/Developer"
          [[ -d "$dev" ]] || { echo "BLOCKED: $dev missing"; exit 2; }
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$dev"
          brew install make xz >/dev/null
          logs="$RUNNER_TEMP/g1-logs"; mkdir -p "$logs"
          {
            sw_vers
            xcodebuild -version
            clang --version
            xcrun --sdk macosx --show-sdk-version
            gmake --version | head -1
            echo "EXTRA_CFLAGS=$EXTRA"
          } | tee "$logs/toolchain.txt"

      - name: Fetch pinned sources and the release oracle
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/g1-logs"
          for spec in "nm https://github.com/nullmoth/nvidia-macos-driver.git $NULLMOTH_COMMIT" \
                      "nv https://github.com/NVIDIA/open-gpu-kernel-modules.git $NVIDIA_COMMIT"; do
            set -- $spec
            d="$RUNNER_TEMP/$1"
            git init -q "$d"; git -C "$d" remote add origin "$2"
            git -C "$d" fetch --no-tags --depth 1 origin "$3"
            git -C "$d" checkout --detach -q FETCH_HEAD
            [[ "$(git -C "$d" rev-parse HEAD)" == "$3" ]]
          done
          o="$RUNNER_TEMP/oracle"; mkdir -p "$o"
          curl -fsSL --proto '=https' --retry 3 -o "$o/release.tar.gz" "$RELEASE_URL"
          echo "$RELEASE_SHA256  $o/release.tar.gz" | shasum -a 256 -c -
          tar -xzf "$o/release.tar.gz" -C "$o" "$NVRM_MEMBER"
          echo "$NVRM_SHA256  $o/$NVRM_MEMBER" | shasum -a 256 -c -
          rm -f "$o/release.tar.gz"
          echo 'PINNED_SOURCES_AND_ORACLE_VERIFIED (oracle is read, never executed)' | tee "$logs/sources.txt"

      - name: Pack actual modeset shader data as Darwin candidate objects
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/g1/pack_shader_objects.py --ogkm "$RUNNER_TEMP/nv" \
            --out-report "$RUNNER_TEMP/g1-logs/shader-pack-candidate.json" \
            2>&1 | tee "$RUNNER_TEMP/g1-logs/shader-pack-candidate.txt"

      - name: Build OGKM Darwin objects with the inferred configuration (objects only)
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/g1-logs"
          nv="$RUNNER_TEMP/nv"
          jobs="$(sysctl -n hw.ncpu)"
          cc="$RUNNER_TEMP/cc-wrap"
          cat > "$cc" <<'SH'
          #!/bin/bash
          # Pass-through to clang, removing exact flags listed in G1_DROP_FLAGS (recorded in toolchain.txt).
          args=()
          for a in "$@"; do
            keep=1
            for d in $G1_DROP_FLAGS; do [[ "$a" == "$d" ]] && keep=0; done
            [[ $keep == 1 ]] && args+=("$a")
          done
          exec clang "${args[@]}"
          SH
          chmod +x "$cc"
          echo "G1_DROP_FLAGS=${G1_DROP_FLAGS:-<none>}" | tee -a "$logs/toolchain.txt"
          for m in nvidia nvidia-modeset; do
            # -k: the final ELF link (GNU ld -T / objcopy) cannot run on macOS; objects are what is compared.
            # Actions starts bash with -e: capture the expected final-link failure explicitly.
            if gmake -C "$nv/src/$m" -k -j"$jobs" TARGET_OS=Darwin TARGET_ARCH=x86_64 CC="$cc" \
              NV_VERBOSE=1 EXTRA_CFLAGS="$EXTRA" > "$logs/make-$m.log" 2>&1; then
              make_rc=0
            else
              make_rc=$?
            fi
            echo "make $m rc=$make_rc" | tee -a "$logs/build-summary.txt"
            # An absent output directory must yield 0, without an ls/pipefail early exit.
            # The modeset Makefile can link its inputs into a separate aggregate .o.
            # Count only the 230 inputs; preserve and account for all five shader .o files.
            n="$(python3 -c 'import pathlib,sys; d=pathlib.Path(sys.argv[1]); mod=sys.argv[2]; print(sum(1 for p in d.glob("*.o") if p.is_file() and not (mod=="nvidia-modeset" and p.name=="nv-modeset-kernel.o")))' "$nv/src/$m/_out/Darwin_x86_64" "$m")"
            if [[ "$m" == nvidia-modeset && -f "$nv/src/$m/_out/Darwin_x86_64/nv-modeset-kernel.o" ]]; then
              echo 'nvidia-modeset derived_output=nv-modeset-kernel.o (excluded from 230 inputs; separately parse-checked)' | tee -a "$logs/build-summary.txt"
            fi
            e="$(grep -c 'error:' "$logs/make-$m.log" || true)"
            echo "$m objects=$n compile_errors=$e" | tee -a "$logs/build-summary.txt"
            grep -E ' -c [^ ]+\.(c|cpp) ' "$logs/make-$m.log" | sed "s#$RUNNER_TEMP#/RUNNER_TEMP#g" \
              > "$logs/compile_cmds-candidate-$m.sh" || true
            grep -B2 -A6 -E 'error:|ld:|gmake: \*\*\*|not remade|not found|No such file' "$logs/make-$m.log" | head -400 > "$logs/first-errors-$m.txt" || true
          done
          echo 'NOTE: compile_cmds-candidate-*.sh are a RECONSTRUCTION CANDIDATE from inferred flags, not NullMoth inputs.' \
            | tee -a "$logs/build-summary.txt"

      - name: Compare candidate objects with the released NVRM
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/g1-logs"
          python3 scripts/g1/b1_rebuild_compare.py \
            --nvrm "$RUNNER_TEMP/oracle/$NVRM_MEMBER" \
            --nullmoth-nvrm-src "$RUNNER_TEMP/nm/kexts/NVRM" \
            --rm-objs "$RUNNER_TEMP/nv/src/nvidia/_out/Darwin_x86_64" \
            --kms-objs "$RUNNER_TEMP/nv/src/nvidia-modeset/_out/Darwin_x86_64" \
            --label "${{ matrix.xcode }} EXTRA_CFLAGS=$EXTRA DROP=${G1_DROP_FLAGS:-none}" \
            --out "$logs/b1-rebuild-compare.json" | tee "$logs/b1-rebuild-compare.txt"

      - name: Require complete object build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/g1-logs" <<'PY'
          import hashlib, json, pathlib, re, sys
          logs = pathlib.Path(sys.argv[1])
          report = json.loads((logs / "b1-rebuild-compare.json").read_text())
          shader_report = json.loads((logs / "shader-pack-candidate.json").read_text())
          errors = []
          summary = (logs / "build-summary.txt").read_text()

          # The packer's pre-build verification is insufficient if make overwrites
          # an object. Recheck hashes of all five genuine shader inputs AFTER make.
          expected_shaders = {"turing", "ampere", "hopper", "blackwell", "gb20x"}
          entries = shader_report.get("shaders", [])
          names = [s.get("arch") for s in entries]
          if (shader_report.get("status") != "complete" or
                  len(entries) != len(expected_shaders) or set(names) != expected_shaders):
              errors.append("shader pack report is missing, incomplete, or has duplicate/unknown inputs")
          else:
              shader_dir = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "nv/src/nvidia-modeset/_out/Darwin_x86_64"
              for s in entries:
                  obj = shader_dir / (s["arch"] + "_shaders.xz.o")
                  if not obj.is_file():
                      errors.append(f"shader object missing after make: {obj.name}")
                  elif hashlib.sha256(obj.read_bytes()).hexdigest() != s.get("object_sha256"):
                      errors.append(f"shader object changed after verified packaging: {obj.name}")
              if not (shader_dir / "g_nvid_string.o").is_file():
                  errors.append("generated g_nvid_string.o missing")

          expected_members = {"nvidia": 1055, "nvidia-modeset": 230}
          expected_closure = {"nvidia": 954, "nvidia-modeset": 189}
          for module, expected in expected_members.items():
              r = report[module]
              if r.get("objects") != expected:
                  errors.append(f"{module}: expected {expected} input objects, got {r.get('objects')}")
              if r.get("unparsable"):
                  errors.append(f"{module}: unparsable Mach-O objects: {r['unparsable'][:3]}")
              match = re.search(rf"^{module} objects=\d+ compile_errors=(\d+)$", summary, re.M)
              if match is None or int(match[1]) != 0:
                  errors.append(f"{module}: compiler errors or missing diagnostic count")
              if not r.get("functions", {}).get("compared"):
                  errors.append(f"{module}: no uniquely comparable functions")
              closure = r.get("closure", {})
              want = expected_closure[module]
              for field in ("predicted_pulled", "observed_in_nvrm", "agree"):
                  if closure.get(field) != want:
                      errors.append(f"{module}: {field}={closure.get(field)} expected {want}")
              for field in ("predicted_not_observed", "observed_not_predicted"):
                  if closure.get(field):
                      errors.append(f"{module}: {field} is nonempty")
          if errors:
              raise SystemExit("DIAGNOSTICS_INCOMPLETE: " + "; ".join(errors))
          print("G1_INPUTS_SHADERS_AND_CLOSURE_COMPLETE (static object comparison only; no GPU validation)")
          PY

      - name: B2/B4 native compile, patched link candidate (explicit opt-in; not acceptance)
        if: ${{ inputs.run_b2_probe || inputs.run_b4_probe || inputs.run_b5_probe || inputs.run_b6_probe || inputs.run_b7_probe || inputs.run_b8_probe }}
        shell: bash
        env:
          B4_ENABLED: ${{ inputs.run_b4_probe || inputs.run_b5_probe || inputs.run_b6_probe || inputs.run_b7_probe || inputs.run_b8_probe }}
          B5_ENABLED: ${{ inputs.run_b5_probe || inputs.run_b6_probe || inputs.run_b7_probe || inputs.run_b8_probe }}
          B6_ENABLED: ${{ inputs.run_b6_probe || inputs.run_b7_probe || inputs.run_b8_probe }}
          B7_ENABLED: ${{ inputs.run_b7_probe || inputs.run_b8_probe }}
          B8_ENABLED: ${{ inputs.run_b8_probe }}
        run: |
          set -euo pipefail
          python3 scripts/g1/test_b3_linkmap.py
          python3 scripts/g1/test_b4_patch_contract.py
          b4_opts=()
          if [[ "$B4_ENABLED" == "true" ]]; then
            b4_opts+=(--b4-patch scripts/g1/patches/b4_nvrm_manual_go_msi_preflight.patch)
          fi
          if [[ "$B5_ENABLED" == "true" ]]; then
            b4_opts+=(--b5-patch scripts/g1/patches/b5_nvrm_bar_rollback.patch)
          fi
          if [[ "$B6_ENABLED" == "true" ]]; then
            b4_opts+=(--b6-patch scripts/g1/patches/b6_nvrm_bar_stop_ownership.patch)
          fi
          if [[ "$B7_ENABLED" == "true" ]]; then
            b4_opts+=(--b7-patch scripts/g1/patches/b7_nvrm_rm_preflight_event_locks.patch)
          fi
          if [[ "$B8_ENABLED" == "true" ]]; then
            b4_opts+=(--b8-patch scripts/g1/patches/b8_nvrm_global_rm_stop_gate.patch)
          fi
          python3 scripts/g1/b2_native_probe.py \
            --nullmoth "$RUNNER_TEMP/nm" \
            --ogkm "$RUNNER_TEMP/nv" \
            --b1-logs "$RUNNER_TEMP/g1-logs" \
            --report "$RUNNER_TEMP/g1-logs/b2-native-probe.json" \
            "${b4_opts[@]}" \
            2>&1 | tee "$RUNNER_TEMP/g1-logs/b2-native-probe.txt"
          # Nonzero is deliberate until the actual WP1 patch and NVRM link are evidenced.

      - name: Upload text diagnostics only (no objects, no kext)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-g1-b1-${{ matrix.xcode }}
          path: ${{ runner.temp }}/g1-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record validation boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## G1 B1 rebuild candidate — ${{ matrix.xcode }}"
            echo '- Inferred configuration, compared against released NVRM v1.15.0; a match is evidence, not NullMoth inputs.'
            echo '- Objects only: no NVRM link, signing, install, load, or binary upload.'
            echo '- No RTX 2050 hardware on this runner; says nothing about GPU rendering.'
            if [[ -f "$RUNNER_TEMP/g1-logs/b1-rebuild-compare.txt" ]]; then
              sed 's/^/    /' "$RUNNER_TEMP/g1-logs/b1-rebuild-compare.txt"
            else
              echo '- Comparison unavailable: inspect build and first-error diagnostics; B1 is not accepted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validator-native-compile:
    needs: xcode-inventory
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.xcode-inventory.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Checkout lab scripts only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile and unit-test the offscreen validator with macOS clang (not run against any GPU)
        shell: bash
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/g1-logs"; mkdir -p "$logs"
          brew install vulkan-headers >/dev/null
          inc="$(brew --prefix)/include"
          cd research/g1-validator
          { xcodebuild -version; clang --version; } | tee "$logs/toolchain.txt"
          python3 gen_spirv.py --check && echo 'SPIRV_HEADER_MATCHES_GENERATOR' | tee -a "$logs/validator.txt"
          clang -std=c11 -O2 -Wall -Wextra -Werror -I"$inc" g1_offscreen.c g1_ref.c -o "$RUNNER_TEMP/g1_offscreen" 2>&1 | tee -a "$logs/validator.txt"
          clang -std=c11 -O2 -Wall -Wextra -Werror test_ref.c g1_ref.c -o "$RUNNER_TEMP/test_ref" 2>&1 | tee -a "$logs/validator.txt"
          "$RUNNER_TEMP/test_ref" | tee -a "$logs/validator.txt"
          "$RUNNER_TEMP/test_ref" kat > "$logs/kat-macos.txt"
          diff -u kat-expected.txt "$logs/kat-macos.txt" && echo 'KAT_MATCHES_LINUX_REFERENCE' | tee -a "$logs/validator.txt"
          "$RUNNER_TEMP/g1_offscreen" --help > "$logs/usage.txt" 2>&1 || true
          echo 'VALIDATOR_NATIVE_COMPILE_PASS (compiled and unit-tested only; no Vulkan device used)' | tee -a "$logs/validator.txt"

      - name: Upload text diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-g1-validator-${{ matrix.xcode }}
          path: ${{ runner.temp }}/g1-logs/
          if-no-files-found: warn
          retention-days: 14
