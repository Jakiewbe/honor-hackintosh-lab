name: HONOR G1 stock v243 full kext link

# Compile/link only. Every failed tool or incomplete object set rejects the probe.
# External imports, loading, GPU execution and device safety remain unverified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honor-g1-stock-v243-kext-link-${{ github.ref }}
  cancel-in-progress: false

env:
  NM_PIN: 272ccd9da04ff5de95c2791b902fe17a3fa77ce7
  NV_PIN: e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  link:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain and offline rejection contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          [[ -d "$DEVELOPER_DIR" ]]
          [[ "$(xcrun --show-sdk-version)" == 15.5 ]]
          command -v gmake >/dev/null || brew install make
          python3 -m unittest discover -s tests -p 'test_stock_v243_link.py' -v

      - name: Fetch the two pinned sources into new directories
        shell: bash
        run: |
          set -euo pipefail
          for spec in "nm https://github.com/nullmoth/nvidia-macos-driver.git $NM_PIN" \
                      "nv https://github.com/NVIDIA/open-gpu-kernel-modules.git $NV_PIN"; do
            read -r name url pin <<< "$spec"
            dir="$RUNNER_TEMP/$name"
            [[ ! -e "$dir" ]]
            git -c core.autocrlf=false init -q "$dir"
            git -C "$dir" config core.autocrlf false
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --no-tags --depth 1 origin "$pin"
            git -C "$dir" checkout --detach -q FETCH_HEAD
            [[ "$(git -C "$dir" rev-parse HEAD)" == "$pin" ]]
          done

      - name: Verify inputs, build object goals, compile twelve TUs and link
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/g1/stock_v243_kext_link.py \
            --nm "$RUNNER_TEMP/nm" --nv "$RUNNER_TEMP/nv" \
            --assets research/stock-v243-once-20261021 \
            --out "$RUNNER_TEMP/link-text" --work "$RUNNER_TEMP/link-products"

      - name: Upload text reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-stock-v243-kext-link-text
          path: ${{ runner.temp }}/link-text/
          if-no-files-found: error
          retention-days: 14
