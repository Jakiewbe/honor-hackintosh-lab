name: HONOR G1 offline entry contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Python 3.9 and Apple bash 3.2 production entry contracts
        shell: bash
        env:
          G1_TEST_BASH: /bin/bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/offline-contract-text"
          python --version > "$RUNNER_TEMP/offline-contract-text/environment.txt"
          /bin/bash --version >> "$RUNNER_TEMP/offline-contract-text/environment.txt"
          [[ "$(/bin/bash -c 'echo ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}')" == 3.2 ]]
          python -c 'import sys; assert sys.version_info[:2] == (3, 9)'
          python - <<'PY'
          import hashlib, json, os, pathlib
          roots = ('scripts/g1', 'tests', 'tools', 'research/stock-v243-offscreen-20261021')
          paths = [p for root in roots for p in pathlib.Path(root).glob('*')
                   if p.suffix in ('.py', '.sh', '.command') and p.is_file()]
          data = dict(commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
                      scope='CONTRACTS_ONLY_NO_FULL_DRIVER_BUILD',
                      files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths})
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'offline-contract-text/source-binding.json'
          out.write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
          python -m unittest discover -s tests -p 'test_stock_v243_offline.py' -v > "$RUNNER_TEMP/offline-contract-text/contracts.txt" 2>&1
          python -m unittest discover -s tests -p 'test_g1_oneclick_wrapper.py' -v > "$RUNNER_TEMP/offline-contract-text/wrapper.txt" 2>&1
          python -m unittest discover -s tests -p 'test_stock_v24*.py' -v > "$RUNNER_TEMP/offline-contract-text/regression.txt" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-offline-contract-text
          path: |
            ${{ runner.temp }}/offline-contract-text/*.txt
            ${{ runner.temp }}/offline-contract-text/*.json
          if-no-files-found: error
          retention-days: 14
