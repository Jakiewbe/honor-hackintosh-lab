name: HONOR G1 kernel vtable observation

# Read-only: dump the IOAcceleratorFamily2 vtable slots from the system kernel collection, resolved to
# symbol names. This is what decides whether the reconstructed io_fam headers match macOS 15.7.9.
# Nothing is built, loaded or executed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Dump the accelerate-family vtables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sw_vers > out/sw_vers.txt
          kc=/System/Library/KernelCollections/SystemKernelExtensions.kc
          ls -l "$kc" > out/collection.txt
          for cls in IOAccelSurface IOAccelContext2 IOAccelGLContext2 IOAccelLegacyDisplayPipe IOAccelLegacyDisplayMachine; do
            python3 tools/g1_kc_vtable.py "$kc" com.apple.iokit.IOAcceleratorFamily2 "$cls" \
              > "out/vtable-$cls.json" 2> "out/vtable-$cls.err" || true
          done
          python3 - <<'PY'
          import json, pathlib
          lines = []
          for path in sorted(pathlib.Path('out').glob('vtable-*.json')):
              try:
                  data = json.loads(path.read_text())
              except Exception as error:
                  lines.append('%s: UNREADABLE %s' % (path.name, error)); continue
              for entry in data['classes']:
                  if entry['status'] != 'VTABLE_DUMPED':
                      lines.append('%s: %s' % (entry['class_name'], entry['status'])); continue
                  lines.append('%s: %d slots' % (entry['class_name'], len(entry['slots'])))
                  for slot in entry['slots']:
                      lines.append('  %3d %s' % (slot['slot'], slot['symbol']))
          pathlib.Path('out/summary.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Decode the vtable slots through the chained fixups
        shell: bash
        run: |
          set -uo pipefail
          kc=/System/Library/KernelCollections/SystemKernelExtensions.kc
          for cls in IOAccelSurface IOAccelContext2 IOAccelGLContext2 IOAccelLegacyDisplayPipe IOAccelLegacyDisplayMachine; do
            python3 tools/g1_kc_chain.py "$kc" com.apple.iokit.IOAcceleratorFamily2 "$cls" \
              > "out/chain-$cls.json" 2> "out/chain-$cls.err" || true
          done
          python3 - <<'PY'
          import json, pathlib
          lines = []
          for path in sorted(pathlib.Path('out').glob('chain-*.json')):
              try:
                  data = json.loads(path.read_text())
              except Exception as error:
                  lines.append('%s: UNREADABLE %s' % (path.name, error)); continue
              for entry in data['classes']:
                  lines.append('%s: %s' % (entry['class_name'], entry['status']))
                  for slot in entry.get('slots', []):
                      lines.append('  %3d %s' % (slot['slot'], slot['symbol']))
          pathlib.Path('out/chain-summary.txt').write_text(chr(10).join(lines) + chr(10))
          print(chr(10).join(lines))
          PY

      - name: Dump the chained-fixup records near each vtable
        shell: bash
        run: |
          set -uo pipefail
          kc=/System/Library/KernelCollections/SystemKernelExtensions.kc
          # Raw vtable words are chained-fixup encoded, not plain addresses. dyld_info decodes them; keep only
          # the window around each vtable so the artifact stays text-sized.
          xcrun dyld_info -fixups "$kc" > out/fixups-all.txt 2> out/fixups.err || true
          wc -l out/fixups-all.txt out/fixups.err || true
          python3 - <<'PY'
          import json, pathlib, re
          out = pathlib.Path('out')
          fixups = (out/'fixups-all.txt')
          if not fixups.exists():
              raise SystemExit('no fixups output')
          region = []
          for path in sorted(out.glob('vtable-*.json')):
              data = json.loads(path.read_text())
              for entry in data['classes']:
                  if entry.get('status') == 'VTABLE_DUMPED':
                      region.append((int(entry['address'], 16), entry['class_name']))
          if not region:
              raise SystemExit('no dumped vtable address')
          text = fixups.read_text(errors='replace').splitlines()
          kept = []
          for line in text:
              m = re.search(r'0x([0-9a-fA-F]+)', line)
              if not m:
                  continue
              value = int(m.group(1), 16)
              if any(start <= value <= start + 0x400 for start, _ in region):
                  kept.append(line)
          (out/'fixups-vtables.txt').write_text('\n'.join(kept) + '\n')
          print('fixup lines near vtables:', len(kept))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: g1-kc-vtable
          path: out/
          if-no-files-found: error
          retention-days: 14
