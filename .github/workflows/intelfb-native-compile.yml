name: HONOR R0.8 NMIntelFB native compile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile: original Intel framebuffer translation unit; link: additionally attempt an unsigned kext executable link"
        type: choice
        default: compile
        required: true
        options:
          - compile
          - link

permissions:
  contents: read

concurrency:
  group: honor-r08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intelfb-native:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      NULLMOTH_COMMIT: 0960b2ef5dbc4a573056d4c8e042a5bd2e15d651
    steps:
      - name: Checkout lab verification scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify x86_64 and Xcode 16
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]] || { echo 'BLOCKED: not Intel macOS'; exit 2; }
          version="$(xcodebuild -version)"
          if [[ "$version" != "Xcode 16."* ]]; then
            selected=''
            for app in /Applications/Xcode_16*.app; do
              if [[ -d "$app/Contents/Developer" ]]; then
                selected="$app/Contents/Developer"
                break
              fi
            done
            [[ -n "$selected" ]] || { echo 'BLOCKED: Xcode 16 unavailable'; exit 2; }
            echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          fi

      - name: Verify exact upstream source and Intel framebuffer plist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r08-logs"
          src="$RUNNER_TEMP/nullmoth-pinned"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/nullmoth/nvidia-macos-driver.git
          git -C "$src" fetch --no-tags --depth 1 origin "$NULLMOTH_COMMIT"
          git -C "$src" checkout --detach --quiet FETCH_HEAD
          [[ "$(git -C "$src" rev-parse HEAD)" == "$NULLMOTH_COMMIT" ]]
          python3 scripts/verify_pinned_source.py --repo "$src" | tee "$RUNNER_TEMP/r08-logs/source-integrity.json"
          plutil -lint "$src/kexts/NMIntelFB/Info.plist" | tee "$RUNNER_TEMP/r08-logs/plist-lint.log"
          [[ -f "$src/kexts/NMIntelFB/display_ids.inc" ]]
          [[ -f "$src/kexts/NMIntelFB/nvrm_vram_abi.h" ]]
          echo 'R08_INTELFB_PINNED_SOURCE_PASS'

      - name: Compile original NMIntelFB.cpp as a native macOS kernel object
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nullmoth-pinned/kexts/NMIntelFB"
          out="$RUNNER_TEMP/r08-intelfb.o"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          khdr="$sdk/System/Library/Frameworks/Kernel.framework/Headers"
          [[ -f "$src/intelfb.cpp" && -d "$khdr/IOKit" ]] || { echo 'BLOCKED: missing source or kernel headers'; exit 2; }
          mkdir -p "$RUNNER_TEMP/r08-logs"
          {
            xcodebuild -version
            echo "SDK=$sdk"
            echo "COMPILER=$(xcrun --find clang++)"
          } > "$RUNNER_TEMP/r08-logs/toolchain.txt"
          set +e
          xcrun clang++ -arch x86_64 -fapple-kext -mkernel -nostdinc \
            -I "$khdr" -I "$src" \
            -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -std=c++17 -fno-rtti -fno-exceptions -fno-builtin -fno-common \
            -Wall -Wno-unused-parameter -Wno-inconsistent-missing-override -O2 \
            -c "$src/intelfb.cpp" -o "$out" > "$RUNNER_TEMP/r08-logs/intelfb-compile.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/r08-logs/intelfb-compile.log"
          if [[ "$rc" -ne 0 ]]; then
            echo "R08_INTELFB_OBJECT_COMPILE_FAILED exit=$rc"
            exit "$rc"
          fi
          file "$out" | tee "$RUNNER_TEMP/r08-logs/object-inspection.txt"
          xcrun nm -u "$out" > "$RUNNER_TEMP/r08-logs/undefined-symbols.txt" || true
          echo 'R08_INTELFB_OBJECT_COMPILE_PASS (not linked; not loadable)'

      - name: Optional unsigned kernel-extension link probe (never install)
        if: ${{ inputs.mode == 'link' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/NMIntelFB"
          set +e
          xcrun clang++ -arch x86_64 -fapple-kext -nostdlib -Xlinker -kext \
            -lkmodc++ -lkmod -lcc_kext "$RUNNER_TEMP/r08-intelfb.o" -o "$out" \
            > "$RUNNER_TEMP/r08-logs/intelfb-link.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/r08-logs/intelfb-link.log"
          if [[ "$rc" -ne 0 ]]; then
            echo "R08_INTELFB_LINK_FAILED exit=$rc"
            exit "$rc"
          fi
          file "$out" | tee -a "$RUNNER_TEMP/r08-logs/object-inspection.txt"
          echo 'R08_INTELFB_LINK_PASS (unsigned build output only; never installed or uploaded)'

      - name: Upload text diagnostics only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honor-r08-intelfb-diagnostics
          path: ${{ runner.temp }}/r08-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Record validation boundary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '## R0.8 — NMIntelFB native compile'
            echo '- Original, unmodified NullMoth version pinned to 0960b2ef.'
            echo '- Compile-only mode tests the actual Intel framebuffer source translation unit, not a synthetic stub.'
            echo '- Link mode is optional and produces no uploaded executable.'
            echo '- No code signing, installation, kext loading, EFI, BIOS or disk changes.'
            echo '- Build success would not establish RTX 2050 acceleration or internal-panel compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"
